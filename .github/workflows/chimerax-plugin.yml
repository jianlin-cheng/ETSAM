# ChimeraX plugin (external_plugins/chimerax-etsam): builds the bundle (.whl)
# and uploads it as a workflow artifact. Part of a release (release.yml), which
# attaches the bundle to the GitHub release.
#
# The bundle is built with ChimeraX's bundle builder, installed with pip from
# ChimeraX's source repository (it is not on PyPI); ChimeraX itself is not
# needed for a Python-only bundle. The bundle has the release's version
# (v1.2.3 -> 1.2.3). The ChimeraX Toolshed has no upload API: upload the .whl
# from the release to https://cxtoolshed.rbvi.ucsf.edu (sign in, then
# "Submit a Bundle").
name: ChimeraX plugin

on:
  push:
    branches: [main]
    paths:
      - external_plugins/chimerax-etsam/**
      - .github/workflows/chimerax-plugin.yml
  pull_request:
    branches: [main]
    paths:
      - external_plugins/chimerax-etsam/**
      - .github/workflows/chimerax-plugin.yml
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  # ChimeraX release whose bundle builder is used (ChimeraX-BundleBuilder 1.6.0).
  CHIMERAX_REF: v1.11.1

jobs:
  build:
    name: Build the bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"  # ChimeraX's Python

      - name: Install the bundle builder
        run: |
          python -m pip install build setuptools Cython numpy packaging wheel
          python -m pip install "ChimeraX-BundleBuilder @ git+https://github.com/RBVI/ChimeraX@${CHIMERAX_REF}#subdirectory=src/bundles/bundle_builder"

      - name: Set the version from the release tag
        if: github.ref_type == 'tag'
        run: python .github/scripts/set_version.py "$GITHUB_REF_NAME"

      # --no-isolation: the bundle builder is installed above, not from PyPI.
      - name: Build the bundle
        working-directory: external_plugins/chimerax-etsam
        run: python -m build --no-isolation --wheel

      # Check the wheel: the package files, and the tool and commands that
      # ChimeraX registers from the metadata.
      - name: Check the bundle
        working-directory: external_plugins/chimerax-etsam
        run: |
          python - <<'EOF'
          import glob, tomllib, zipfile
          version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          wheel = glob.glob("dist/*.whl")
          assert wheel == [f"dist/chimerax_etsam-{version}-py3-none-any.whl"], wheel
          with zipfile.ZipFile(wheel[0]) as z:
              names = set(z.namelist())
              metadata = z.read(f"chimerax_etsam-{version}.dist-info/METADATA").decode()
          for module in ["__init__", "cmd", "tool", "manager", "etsam_env", "etsam_run", "etsam_worker"]:
              assert f"chimerax/etsam/{module}.py" in names, module
          assert "chimerax/etsam/docs/etsam.html" in names
          for entry in ["Tool :: ETSAM Membrane Segmentation", "Command :: etsam segment",
                        "Command :: etsam save", "Command :: etsam cancel"]:
              assert f"ChimeraX :: {entry} ::" in metadata, entry
          print(f"{wheel[0]}: OK")
          EOF

      - name: Upload the bundle
        uses: actions/upload-artifact@v4
        with:
          name: chimerax-bundle
          path: external_plugins/chimerax-etsam/dist/*.whl
          if-no-files-found: error
