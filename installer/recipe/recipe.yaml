# conda package for ETSAM, built with rattler-build and bundled into the ETSAM
# installer (see ../construct.yaml). Build: see ../README.md.
context:
  version: ${{ env.get("ETSAM_VERSION", default="1.1.0") }}

package:
  name: etsam
  version: ${{ version }}

source:
  path: ../..
  # Only what the package needs; the repository also holds large data folders.
  filter:
    include:
      - etsam.py
      - etsam_assets/**
      - inference.py
      - postprocess.py
      - sam2/**
      - pyproject.toml
      - README.md
      - ETSAM_icon.svg
      - LICENSE

build:
  number: 0
  noarch: python
  script: python -m pip install . --no-deps --no-build-isolation -vv
  python:
    entry_points:
      - etsam = etsam:main
      - etsam-postprocess = postprocess:_run_cli

requirements:
  host:
    - python >=3.10
    - pip
    - setuptools >=77
  run:
    - python >=3.10
    - numpy >=1.24.4
    - scipy
    - scikit-image
    - mrcfile
    - hydra-core >=1.3.2
    - omegaconf
    - iopath >=0.1.10
    - pillow >=10.3.0
    - rich >=13.4
    - textual-image >=0.14.1,<0.15
    - tqdm >=4.66.1
  # PyTorch is required but deliberately not a hard dependency: the installer
  # adds the build that matches the GPU (see ../post_install.sh), so the
  # installer does not have to ship a CPU or CUDA build of its own.
  run_constraints:
    - pytorch >=2.5.1

tests:
  - python:
      imports:
        - postprocess
      pip_check: false

about:
  homepage: https://github.com/jianlin-cheng/ETSAM
  license: MIT
  license_file: LICENSE
  summary: Effectively Segmenting Membranes in cryo-Electron Tomograms
  documentation: https://jianlin-cheng.github.io/ETSAM/
