# TEMPORARY (macos-apple-silicon branch): find where ETSAM on MPS departs from
# the CPU. Remove before merging.
name: MPS debug

on:
  push:
    branches: [macos-apple-silicon]
    paths:
      - .github/workflows/mps-debug.yml
      - tests/e2e/compare_devices.py
      - tests/e2e/check_segmentation.py
      - tests/e2e/replay_ops.py
      - tests/e2e/run_blocking.py
      - sam2/**
      - inference.py
      - etsam.py

permissions:
  contents: read

jobs:
  compare:
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4

      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: etsam
          python-version: "3.12"
          channels: conda-forge

      - name: Install ETSAM's dependencies
        run: |
          conda install --yes -c conda-forge pytorch=2.7.1 numpy scipy scikit-image mrcfile \
            "hydra-core>=1.3.2" omegaconf "iopath>=0.1.10" pillow rich "textual-image>=0.14.1,<0.15" tqdm
          python -c "import torch; print(torch.__version__, torch.backends.mps.is_available())"

      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/etsam
          key: etsam-weights-db2dc46d775a17619e0a657aabaf0636-170488377f1424be1c431bc7983c21b4

      # Is MPS deterministic, and do non-blocking copies to the CPU change the result?
      - name: MPS twice, MPS with blocking copies, and the CPU
        run: |
          T="$RUNNER_TEMP"
          python tests/fetch_test_tomogram.py "$T/tomogram.mrc"
          for run in mps1 mps2; do python etsam.py "$T/tomogram.mrc" --output-dir "$T/$run" --store-logits > /dev/null 2>&1; done
          python tests/e2e/run_blocking.py "$T/tomogram.mrc" --output-dir "$T/blocking" --store-logits > /dev/null 2>&1
          ETSAM_DEVICE=cpu python etsam.py "$T/tomogram.mrc" --output-dir "$T/cpu" --store-logits > /dev/null 2>&1
          L=tomogram_etsam_predicted_logits.mrc
          for pair in "mps1 mps2" "mps1 cpu" "mps2 cpu" "blocking cpu"; do
            set -- $pair
            echo "===== $1 vs $2"
            python tests/e2e/check_segmentation.py "$T/tomogram.mrc" --logits "$T/$1/$L" --reference "$T/$2/$L" \
              | grep -E "correlation|Dice|no object" || true
            python -c "import mrcfile, numpy as np, sys; a, b = (mrcfile.read(p) for p in sys.argv[1:]); print('identical:', np.array_equal(a, b), 'max abs difference:', float(np.abs(a - b).max()))" "$T/$1/$L" "$T/$2/$L"
          done

  windows-conda:
    if: false  # done: Miniforge 26.9.4-0 fails on Windows; pinned 26.7.2-0
    name: Windows setup-miniconda (${{ matrix.name }})
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: v3, latest Miniforge
            action: v3
            miniforge: latest
          - name: v4.1.0, latest Miniforge
            action: v4.1.0
            miniforge: latest
          - name: v3, Miniforge 26.7.2-0
            action: v3
            miniforge: 26.7.2-0
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - if: matrix.action == 'v3'
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: ${{ matrix.miniforge }}
          activate-environment: etsam-build
          channels: conda-forge
      - if: matrix.action == 'v4.1.0'
        uses: conda-incubator/setup-miniconda@v4.1.0
        with:
          miniforge-version: ${{ matrix.miniforge }}
          activate-environment: etsam-build
          channels: conda-forge
      - run: conda --version && conda install --yes -c conda-forge rattler-build constructor && constructor --version
