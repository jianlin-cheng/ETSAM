[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "etsam"
version = "1.1.1"
description = "ETSAM: Effectively Segmenting Membranes in cryo-Electron Tomograms"
readme = "README.md"
license = "MIT"
authors = [{ name = "Joel Selvaraj", email = "jsbrq@missouri.edu" }]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.5.1",
    "numpy>=1.24.4",
    "scipy",
    "scikit-image",
    "mrcfile",
    "hydra-core>=1.3.2",
    "iopath>=0.1.10",
    "pillow>=10.3.0",
    "rich>=13.4",
    "textual-image>=0.14.1,<0.15",
    "tqdm>=4.66.1",
]

[project.optional-dependencies]
dev = [
    "torchvision>=0.20.1",
    "black>=24.2.0",
    "usort>=1.0.2",
    "ufmt>=2.0.0b2",
    "fvcore>=0.1.5.post20221221",
    "pandas>=2.2.2",
    "tensorboard>=2.16.2",
    "pycocotools>=2.0.8",
    "tensordict>=0.6.0",
    "opencv-python>=4.7.0",
    "submitit>=1.5.1",
]

[project.scripts]
etsam = "etsam:main"
etsam-postprocess = "postprocess:_run_cli"

[project.urls]
Homepage = "https://github.com/jianlin-cheng/ETSAM"
Documentation = "https://jianlin-cheng.github.io/ETSAM/"

[tool.setuptools]
py-modules = ["etsam", "inference", "postprocess"]

[tool.setuptools.packages.find]
include = ["sam2*", "etsam_assets"]

[tool.setuptools.package-data]
sam2 = ["configs/**/*.yaml"]
etsam_assets = ["*.png"]

# Include the project icon with command-line installations.
[tool.setuptools.data-files]
"share/etsam" = ["ETSAM_icon.svg"]
