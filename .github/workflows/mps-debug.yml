# TEMPORARY (macos-apple-silicon branch): find where ETSAM on MPS departs from
# the CPU. Remove before merging.
name: MPS debug

on:
  push:
    branches: [macos-apple-silicon]
    paths:
      - .github/workflows/mps-debug.yml
      - tests/e2e/compare_devices.py
      - tests/e2e/check_segmentation.py
      - tests/e2e/replay_ops.py
      - tests/e2e/run_autocast.py
      - sam2/**
      - inference.py
      - etsam.py

permissions:
  contents: read

jobs:
  compare:
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4

      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: etsam
          python-version: "3.12"
          channels: conda-forge

      - name: Install ETSAM's dependencies
        run: |
          conda install --yes -c conda-forge pytorch=2.7.1 numpy scipy scikit-image mrcfile \
            "hydra-core>=1.3.2" omegaconf "iopath>=0.1.10" pillow rich "textual-image>=0.14.1,<0.15" tqdm
          python -c "import torch; print(torch.__version__, torch.backends.mps.is_available())"

      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/etsam
          key: etsam-weights-db2dc46d775a17619e0a657aabaf0636-170488377f1424be1c431bc7983c21b4

      # MPS in float32 (twice: deterministic?) and with bfloat16 autocast, as on
      # CUDA, on 16 slices; the logits are compared with CUDA's outside CI.
      - name: MPS float32 twice, and bfloat16
        run: |
          T="$RUNNER_TEMP/out"
          python tests/fetch_test_tomogram.py "$T/tomogram.mrc" --slices 16
          for run in float32 float32_again; do
            /usr/bin/time -p python etsam.py "$T/tomogram.mrc" --output-dir "$T/$run" --store-logits 2>&1 | grep -E "^real|Error|Running on"
          done
          /usr/bin/time -p python tests/e2e/run_autocast.py bfloat16 "$T/tomogram.mrc" --output-dir "$T/bfloat16" --store-logits 2>&1 \
            | grep -E "^real|Error|Running on|Traceback|rror"
          python -c "import mrcfile, numpy as np, sys; a, b = (mrcfile.read(p) for p in sys.argv[1:]); print('float32 runs identical:', np.array_equal(a, b))" \
            "$T/float32/tomogram_etsam_predicted_logits.mrc" "$T/float32_again/tomogram_etsam_predicted_logits.mrc"

      - uses: actions/upload-artifact@v4
        with:
          name: mps-logits
          path: ${{ runner.temp }}/out/*/*logits.mrc
          retention-days: 3

  windows-conda:
    if: false  # done: Miniforge 26.9.4-0 fails on Windows; pinned 26.7.2-0
    name: Windows setup-miniconda (${{ matrix.name }})
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: v3, latest Miniforge
            action: v3
            miniforge: latest
          - name: v4.1.0, latest Miniforge
            action: v4.1.0
            miniforge: latest
          - name: v3, Miniforge 26.7.2-0
            action: v3
            miniforge: 26.7.2-0
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - if: matrix.action == 'v3'
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: ${{ matrix.miniforge }}
          activate-environment: etsam-build
          channels: conda-forge
      - if: matrix.action == 'v4.1.0'
        uses: conda-incubator/setup-miniconda@v4.1.0
        with:
          miniforge-version: ${{ matrix.miniforge }}
          activate-environment: etsam-build
          channels: conda-forge
      - run: conda --version && conda install --yes -c conda-forge rattler-build constructor && constructor --version
