name: Deploy Docs

# Deploys the documentation to GitHub Pages for a release (release.yml runs this
# workflow on main after creating the release) or when run by hand from the
# Actions tab. Not on pushes, so that documentation for unreleased changes is
# never published early.
on:
  workflow_dispatch:
  # TEMPORARY, until Settings > Pages > Source is set to "GitHub Actions": with
  # the source set to "Deploy from a branch", GitHub's own "pages build and
  # deployment" workflow publishes the main branch as it is on every push, which
  # would replace the documentation site. Deploy the documentation again after
  # it has finished, so that the documentation is what stays published. Once the
  # source is "GitHub Actions", that workflow no longer runs, and this trigger
  # can be removed.
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        working-directory: docs
        run: npm ci

      - name: Build docs
        working-directory: docs
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/dist
          include-hidden-files: true

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
